services:
  app:
    build: .
    container_name: psw-ap7-app
    environment:
      PORT: "3000"
      JWT_SECRET: "${JWT_SECRET:-laboratorio-local-cambiar-en-produccion}"
    ports:
      - "3000:3000"
    networks:
      - devsecops
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  jenkins:
    profiles: ["ci"]
    build:
      context: .
      dockerfile: infra/jenkins/Dockerfile
    container_name: psw-ap7-jenkins
    user: root
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
    ports:
      - "8081:8080"
      - "50001:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - devsecops

networks:
  devsecops:
    name: psw-ap7-devsecops

volumes:
  jenkins_home:

